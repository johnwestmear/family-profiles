name = "family-profiles"
main = "src/index.js"
compatibility_date = "2025-01-01"

# KV namespace "family-profiles-PROFILES" (already created)
[[kv_namespaces]]
binding = "PROFILES"
id = "814a7fada2c049bda3e9245babe8dc0b"

[vars]
STREMIO_API = "https://api.strem.io"
# Only this Stremio email can set the addon up.
ALLOWED_EMAIL = "samtarrant12@gmail.com"

# Pre-rendered emoji profile tiles (scripts/build-posters.mjs)
[assets]
directory = "./public"

# Daily stats snapshot + auto switch-back check
[triggers]
crons = ["*/10 * * * *"]
